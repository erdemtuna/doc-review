name: test

on:
  push:
    branches: [main]
  pull_request:

env:
  NPM_VERSION: "12.0.2"
  NPM_CONFIG_REGISTRY: "https://registry.npmjs.org"

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "24.21.0"
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 24
          - os: ubuntu-latest
            node: 26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global --no-audit --no-fund npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:package

  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
      - run: npm install --global --no-audit --no-fund npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - run: npm run browser:install:ci
      - run: npm run test:browser
      - run: npm run test:package:browser
