<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>doc-review</title>
  <link rel="stylesheet" href="/chrome.css">
</head>
<body data-session="__SESSION_ID__" data-token="__TOKEN__">
  <div class="app">
    <header class="toolbar shell-toolbar review-ui" aria-label="Review controls">
      <div id="toolbarRoot"></div>
    </header>
    <main class="stage">
      <div id="noticesRoot" class="review-ui"></div>
      <div class="document-host">
      <iframe
        id="frame"
        title="Artifact under review"
        sandbox="allow-scripts allow-forms allow-modals"></iframe>
      <section id="historyPanel" class="history-panel review-ui" aria-labelledby="historyTitle" hidden>
        <h1 id="historyTitle" class="sr-only">Changes</h1>
        <div id="changesControlsRoot" class="review-ui"></div>
        <div id="comparisonHeader" class="comparison-header">
          <div id="changesNavigationRoot" class="review-ui"></div>
          <div class="comparison-heading-slot"></div>
        </div>
        <article id="changeDetail" class="change-detail" aria-label="Continuous before and after comparison"></article>
        <div id="changesDiagnosticsRoot" class="review-ui"></div>
      </section>
      </div>
    </main>

    <section id="compose" class="contextual-compose review-ui" role="dialog" aria-modal="false" aria-labelledby="composeTitle" hidden></section>

    <div id="alignedCard" class="aligned-card review-ui" hidden></div>

    <aside class="drawer" id="drawer" aria-label="Feedback" aria-hidden="true">
      <div id="drawerHeadRoot" class="review-ui"></div>
      <div id="commentsSection" class="drawer-inventory" tabindex="-1" aria-label="Feedback items">
        <div id="inventoryRoot" class="review-ui"></div>
        <div id="editsRoot" class="review-ui"></div>

      </div>
      <footer id="sendSection" class="drawer-footer send-section review-ui" tabindex="-1" aria-label="Send feedback"></footer>
    </aside>
    <div id="drawerBackdropRoot"></div>
    <div id="liveRegion" class="sr-only" role="status" aria-live="polite"></div>
  </div>

  <script type="module" src="/chrome.js"></script>
</body>
</html>
